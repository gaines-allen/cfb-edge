name: Watchdog

# Nobody was looking.
#
# On 26 August the 2 PM job failed a gate, published nothing, and the page
# sat 28 hours stale for 3 hours. The gate was right to refuse and the page
# was right to take the board down. Both facts sat there unread.
#
# This reads them. It asks the outcome question first, whether the page a
# reader loads right now is current, because that catches every cause at
# once: a failed run, a run that went green and published nothing, a broken
# deploy, a cron that stopped firing, an expired secret. Then it opens an
# issue, which emails whoever watches the repo, and closes it when the site
# recovers so a healthy repo has no open alarm.

on:
  schedule:
    # Every 4 hours. Two checks a day was not enough: the watchdog's own
    # crons are as best effort as the ones it watches, and on 27 August
    # its midnight check fired at 08:37. Six attempts a day means a
    # skipped one costs coverage rather than removing it. A check that
    # finds nothing wrong is a curl and a script, and spends nothing.
    - cron: "0 */4 * * *"
  # And immediately when one of the jobs that publishes gives up, which
  # says the same thing hours earlier and names the step.
  workflow_run:
    workflows: ["Daily update", "Weekly card", "Saturday tracking"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # write, because this does more than report now. See the recovery
      # step below.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ask whether the live page is current
        id: check
        run: |
          LAST=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=1&status=completed" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs') or [{}]; print(r[0].get('conclusion') or '')")
          CARD=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/weekly-card.yml/runs?per_page=1&status=completed" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs') or [{}]; print(r[0].get('conclusion') or '')")
          echo "last daily run: $LAST"
          echo "last card run: $CARD"
          set +e
          python3 scripts/healthcheck.py --last-run "$LAST" --last-card "$CARD" > /tmp/health.json
          echo "healthy=$?" >> $GITHUB_OUTPUT
          set -e
          cat /tmp/health.json
          echo "recover=$(python3 -c "
          import json; print(str(json.load(open('/tmp/health.json'))['should_recover']).lower())")" >> $GITHUB_OUTPUT
          {
            echo 'report<<REPORT'
            python3 -c "
          import json
          d = json.load(open('/tmp/health.json'))
          print('Checked ' + d['checked_at'] + '.')
          print()
          for p in d['problems']:
              print('- ' + p)
          print()
          age = d['page_age_hours']
          print('Page age: ' + ('unknown' if age is None else str(age) + ' hours') + '.')
          print('Last Daily update run: ' + str(d['last_run'] or 'unknown') + '.')
          "
            echo 'REPORT'
          } >> $GITHUB_OUTPUT

      # GitHub cron is best effort. Scheduled runs here normally fire 14
      # to 89 minutes late, and on 27 August the 2 PM pull did not fire at
      # all. Rather than wait for a scheduler that already skipped, pull
      # the data. This starts 6 hours before readers would lose the board.
      #
      # Never on workflow_run. A failing daily job leaves the page old, so
      # recovering from its own completion event would dispatch it again
      # the moment it failed, and again after that. Recovery only from a
      # scheduled or manual check, which caps it at one attempt per cycle.
      - name: Pull the data the scheduler skipped
        if: |
          github.event_name != 'workflow_run' &&
          steps.check.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Page is past the recovery threshold. Dispatching daily.yml."
          gh workflow run daily.yml --ref main

      # The card is the week's one deliverable and its schedule has the
      # worst record of any here: 2 windows since it was added, 0 runs. A
      # missed daily pull costs a day of freshness. A missed Friday costs
      # the card, and there is no second chance before kickoff.
      #
      # So on a Thursday or Friday, past the hour it was due, if no run
      # has started today, start one. It opens a pull request and
      # publishes nothing, so the cost of a spurious run is a draft nobody
      # merges.
      - name: Start the card if its schedule skipped
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOW=$(date -u +%u)
          HOUR=$(date -u +%H)
          # The card is due Wednesday 18:00 UTC. It used to run Thursday
          # and Friday at different hours, which needed a lookup. One
          # card, one day, one hour.
          if [ "$DOW" != "3" ]; then
            echo "Not a card day."; exit 0
          fi
          DUE=18
          if [ "$HOUR" -lt "$DUE" ]; then
            echo "Card is not due yet today (due ${DUE}:00 UTC)."; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          RAN=$(gh run list --workflow weekly-card.yml --limit 20 \
            --json createdAt --jq "[.[] | select(.createdAt | startswith(\"$TODAY\"))] | length")
          if [ "$RAN" != "0" ]; then
            echo "Card already ran today ($RAN run(s))."; exit 0
          fi
          echo "No card run today and it is past due. Starting one."
          gh workflow run weekly-card.yml --ref main

      - name: Raise the alarm
        if: steps.check.outputs.healthy != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Site is not current"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          BODY="${{ steps.check.outputs.report }}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This closes itself once the live page is current again."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Stand down
        if: steps.check.outputs.healthy == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Site is not current in:title" \
              --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Live page is current again. ${{ steps.check.outputs.report }}"
          done
