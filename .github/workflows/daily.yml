name: Daily update

# What runs here is only the deterministic half of the system: pull the
# FanDuel board, settle anything that finished, rebuild the page, commit.
# Making the picks needs an agent doing actual research, so that runs on
# Wednesday from Claude, not from here.

on:
  schedule:
    # 14:00 Eastern, every day. The site's promise is that lines are at
    # most a day old, and 2 PM catches the morning's moves. GitHub crons
    # are UTC, so this drifts to 1 PM Eastern when daylight time ends in
    # November. An hour early beats a second daily pull.
    - cron: "0 18 * * *"
    # Saturday 11:00 and 13:00 Eastern. These two runs capture closing
    # lines before the noon and afternoon kicks, so they matter more than
    # any other pull in the week.
    - cron: "0 15 * * 6"
    - cron: "0 17 * * 6"
    # Sunday 09:00 Eastern. Saturday is final, the grader settles the card,
    # rebuilds calibration and the factor scorecard, and the results page
    # is up by the time anyone checks it over coffee.
    - cron: "0 13 * * 0"
  # Touch .github/refresh-now and push to force a full rebuild between
  # scheduled runs. Scoped to that one file so an ordinary push never
  # spends API credits, and useful when a model change means the stored
  # slate is wrong until the next 2 PM pull.
  push:
    paths:
      - ".github/refresh-now"
  workflow_dispatch:
    inputs:
      markets:
        description: "Market set to pull"
        required: false
        default: "default"
        type: choice
        options: [default, all]
      season:
        description: "Season to grade"
        required: false
        default: "2026"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # These two need API keys and reach out to the network, so a bad day
      # upstream must not stop the page from rebuilding and deploying. A
      # stale board on a live page beats a dead page.
      - name: Pull the FanDuel board
        id: odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/fetch_odds.py --markets "${{ inputs.markets || 'default' }}"

      - name: Grade anything that finished
        id: grade
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python3 scripts/grade_results.py --season "${{ inputs.season || '2026' }}"

      # Re-measure how far the model sits from the market before building
      # the slate. Ratings move weekly in season, and a stale bias makes
      # every total look like an under.
      - name: Recalibrate against the market
        id: calibrate
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python3 scripts/calibrate_model.py --season "${{ inputs.season || '2026' }}"

      # Build the candidate slate here rather than at pick time. The
      # Wednesday handicapper session has no API keys of its own, so it
      # reads data/slate.json and data/board.json straight out of the repo.
      - name: Build the candidate slate
        id: slate
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python3 scripts/make_slate.py --season "${{ inputs.season || '2026' }}"

      # Track the top 6 leans and how they move. Runs after the slate so
      # it reads today's numbers, and before the page so the site renders
      # what it just recorded.
      - name: Update the running card
        id: running
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/build_running_card.py

      - name: Check the grading math and the name matcher
        run: python3 scripts/selftest.py

      - name: Report what failed
        if: steps.odds.outcome == 'failure' || steps.grade.outcome == 'failure' || steps.slate.outcome == 'failure' || steps.calibrate.outcome == 'failure' || steps.running.outcome == 'failure'
        run: |
          echo "### A step did not finish clean" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Odds pull: ${{ steps.odds.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Grading: ${{ steps.grade.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Calibration: ${{ steps.calibrate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Slate build: ${{ steps.slate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Running card: ${{ steps.running.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Usual causes: ODDS_API_KEY or CFBD_API_KEY missing from repository secrets, the monthly credit quota is spent, or a school name failed to map between sources. Open the failing step's log. A name mapping failure lists the exact spelling and gets fixed in scripts/lib/teams.py, never by hand-editing data." >> $GITHUB_STEP_SUMMARY

      - name: Rebuild the page
        run: python3 scripts/build_site.py

      - name: Commit
        run: |
          git config user.name "cfb-edge-bot"
          git config user.email "actions@github.com"
          git add data site
          if git diff --staged --quiet; then
            echo "Nothing moved."
          else
            git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
