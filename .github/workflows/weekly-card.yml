name: Weekly card

# The research half, run unattended. The daily job does the deterministic
# work and stops, because making a pick needs an agent that can read an
# injury report. This runs that agent, validates what it produced, and opens
# a pull request. It never writes to main and never publishes on its own.
#
# The boundary matters more than anything else here. The agent writes one
# file, picks_draft.json, which is gitignored scratch. Deterministic code
# then checks the card against scripts/lib/card_rules.py, and only a card
# that passes reaches data/picks.json. A person merges the pull request.

on:
  schedule:
    # Thursday and Friday at 14:00 Eastern. Thursday's run is scoped to
    # games kicking before Friday evening, so a Thursday game the research
    # actually likes publishes ahead of its kickoff instead of after it.
    # Friday's run is the full card, ready for the 6 PM Eastern publish
    # once the pull request is merged. The scope is derived from the day
    # below, because schedule events cannot carry inputs.
    - cron: "0 18 * * 4"
    - cron: "0 18 * * 5"
  # Touch .github/run-card and push to start a run now.
  #
  # This workflow has had 2 scheduled windows since it was added and fired
  # on neither. GitHub schedules are best effort and get dropped under
  # load, which is survivable for a daily pull and not survivable for the
  # one beat of the week the site is built around. A push trigger scoped
  # to a single file is a lever that does not depend on their scheduler.
  #
  # A push run takes the full scope, the same as Friday, because the
  # Thursday narrowing is derived from the schedule event below.
  push:
    paths:
      - ".github/run-card"
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: false
        default: "2026"
      week:
        description: "Week, blank for the current one"
        required: false
        default: ""
      max_turns:
        description: "Cap on agent turns, which is the cost control"
        required: false
        default: "60"
      research_only:
        description: "Stop after the draft and skip the pull request"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  # Opening a pull request depends on a repository setting this workflow
  # cannot turn on. Opening an issue does not, and the watchdog has been
  # doing it reliably, so an issue is the delivery route that always works.
  issues: write

concurrency:
  group: weekly-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      # The suite gates everything downstream. A broken grader or a changed
      # upstream shape must stop the run before an agent reasons off it.
      - name: Check the suite first
        run: python3 scripts/selftest.py -q

      - name: Refresh the board and rebuild the slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          WEEK="${{ inputs.week }}"
          SEASON="${{ inputs.season || '2026' }}"
          python3 scripts/fetch_odds.py
          python3 scripts/calibrate_model.py --season "$SEASON" ${WEEK:+--week "$WEEK"}
          python3 scripts/make_slate.py --season "$SEASON" ${WEEK:+--week "$WEEK"}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Not --bare, on purpose. Bare mode skips CLAUDE.md and the agent
      # definitions in .claude/, and those are the instructions the
      # handicapper needs. This repository is the one being run, so loading
      # its own configuration is the intent rather than a risk.
      #
      # dontAsk denies anything outside the allow list rather than waiting
      # for a prompt that will never come. The agent gets the web and its
      # own draft file, and nothing that can reach the ledger or git.
      #
      # The draft rule is spelled Edit, not Write. Claude Code checks file
      # permissions against Edit(path) and Read(path) rules only, so a
      # Write(path) rule is accepted and then never consulted. The first
      # unattended run spent 16 minutes researching and could not write its
      # own output, because Write(picks_draft.json) granted nothing and a
      # bare Edit deny blocked the write. The deny rules below are scoped
      # to paths for the same reason: a bare tool name denies everywhere.
      - name: Research the slate and write the draft
        id: research
        env:
          # A subscription token rather than an API key, so the run bills
          # against the Claude plan already being paid for instead of
          # metered API usage. Generate it with claude setup-token, which
          # mints a 1 year OAuth token on a Pro, Max, Team or Enterprise
          # plan. Note that --bare does not read this variable, which is a
          # second reason the step below does not pass it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with"
            echo "claude setup-token and add it as a repository secret."
            exit 1
          fi
          # Strip every whitespace character out of the token. A token copied
          # from an 80 column terminal carries a line break at character 80,
          # because the soft wrap becomes a real newline on copy, and the API
          # then rejects the Authorization header. The token itself contains
          # no whitespace, so removing all of it is safe and repairs a secret
          # that was pasted with the break already in it.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export CLAUDE_CODE_OAUTH_TOKEN
          set -o pipefail
          # Thursday runs are scoped to the early games. Friday and manual
          # runs take the whole slate.
          SCOPE="full"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "4" ]; then
            SCOPE="thursday"
          fi
          claude -p "/research-card season ${{ inputs.season || '2026' }} week ${{ inputs.week || 'current' }} scope $SCOPE" \
            --model opus \
            --permission-mode dontAsk \
            --max-turns "${{ inputs.max_turns || '60' }}" \
            --output-format json \
            --allowedTools \
              "WebSearch" \
              "WebFetch" \
              "Read" \
              "Glob" \
              "Grep" \
              "Edit(picks_draft.json)" \
              "Bash(python3 scripts/make_slate.py *)" \
            --disallowedTools \
              "Edit(data/**)" \
              "Edit(site/**)" \
              "Edit(scripts/**)" \
              "Edit(.github/**)" \
              "Bash(git *)" \
              "Bash(python3 scripts/log_picks.py *)" \
              "Bash(python3 scripts/fetch_odds.py *)" \
              "Bash(rm *)" \
            > research.json || true
          # claude -p exits non zero when it hits the turn cap, and the
          # result comes back empty, so read the payload rather than the
          # exit code. num_turns counts messages including tool results and
          # runs higher than --max-turns, which counts assistant turns.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          try:
              d = json.load(open("research.json"))
          except (OSError, json.JSONDecodeError) as e:
              print(f"### The handicapper produced no readable output\n\n{e}\n")
              sys.exit(1)
          subtype = d.get("subtype")
          print("### Handicapper run\n")
          print(f"Cost estimate: ${d.get('total_cost_usd', 0):.2f}\n")
          print(f"Turns: {d.get('num_turns')} messages\n")
          print(f"Session: `{d.get('session_id', 'unknown')}`\n")
          if subtype == "error_max_turns":
              print("Stopped at the turn cap before finishing. Raise max_turns "
                    "or narrow the slate, and treat any draft it left as "
                    "partial.\n")
              sys.exit(1)
          if d.get("is_error"):
              print(f"Failed with subtype `{subtype}`.\n")
              # Claude Code puts the reason in result, including auth
              # failures. Printing only the subtype hides the one line that
              # says what went wrong.
              print("```")
              print((d.get("result") or "no message returned")[:2000])
              print("```")
              sys.exit(1)
          print("```")
          print((d.get("result") or "")[:3000])
          print("```")
          PY

      - name: Fail if the agent wrote outside its lane
        run: |
          # The agent may create picks_draft.json and nothing else. Anything
          # else in the tree means the boundary did not hold.
          git add -A -n 2>/dev/null || true
          STRAY=$(git status --porcelain | grep -v '^?? picks_draft.json$' \
                  | grep -v '^?? research.json$' \
                  | grep -v '^ M data/' | grep -v '^?? data/' || true)
          if [ -n "$STRAY" ]; then
            echo "The agent touched files it was not allowed to touch:"
            echo "$STRAY"
            exit 1
          fi
          echo "Boundary held."

      - name: Validate the card
        id: validate
        run: |
          if [ ! -f picks_draft.json ]; then
            # Never treat this as a quiet no card. The agent is told to
            # write an empty list when nothing clears 8.0, so a missing
            # file means it could not write at all, which is what a
            # permission mistake looks like from the outside.
            echo "picks_draft.json is missing. The agent did not write it."
            echo "That is a permission or tooling failure, not an empty card."
            echo "### The handicapper could not write its draft" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < picks_draft.json)" = "[]" ]; then
            echo "no_card=true" >> "$GITHUB_OUTPUT"
            echo "Nothing cleared 8.0. A short card beats a padded one." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/validate_card.py --file picks_draft.json --json \
            | tee validation.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          v = json.load(open("validation.json"))
          print("\n### Card validation\n")
          print(f"{v['picks']} rated, {v['live']} live, "
                f"{v['units_at_risk']} units at risk.\n")
          for w in v["warnings"]:
              print(f"Warning: {w}\n")
          PY

      # A card that breaks a rule stops here, and data/picks.json is never
      # opened. The draft is uploaded so the rejection can be read.
      # Open every cited page and check the claim is really on it. A url and
      # a date only prove a page exists. Without this a paraphrase, a
      # misremembered quote, or a page that says the opposite all pass.
      - name: Verify every cited source
        if: steps.validate.outputs.no_card != 'true'
        id: sources
        run: |
          python3 scripts/verify_sources.py --file picks_draft.json \
            --out verification.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          v = json.load(open("verification.json"))
          print("\n### Source verification\n")
          print(f"{v['sources_verified']} of {v['sources_checked']} cited "
                f"sentences were found on the page they came from.\n")
          for line in v["unverified_on_live_picks"]:
              print(f"- UNVERIFIED: {line}\n")
          print(f"\n{v['note']}\n")
          PY

      - name: Keep whatever the run produced
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          if-no-files-found: ignore
          path: |
            picks_draft.json
            validation.json
            verification.json
            research.json

      - name: Log the card and rebuild the page
        if: steps.validate.outputs.no_card != 'true' && inputs.research_only != true
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          SEASON="${{ inputs.season || '2026' }}"
          WEEK="${{ inputs.week }}"
          # Rehearse first. A dry run prints what would change and writes
          # nothing, so a surprise shows up before the ledger is touched.
          python3 scripts/log_picks.py --file picks_draft.json \
            --season "$SEASON" ${WEEK:+--week "$WEEK"} --dry-run
          python3 scripts/log_picks.py --file picks_draft.json \
            --season "$SEASON" ${WEEK:+--week "$WEEK"}
          python3 scripts/build_site.py

      - name: Open a pull request
        if: steps.validate.outputs.no_card != 'true' && inputs.research_only != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="card/$(date -u +'%Y-week%V')-${{ github.run_id }}"
          git config user.name "cfb-edge-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add data site
          if git diff --staged --quiet; then
            echo "Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Weekly card: $(date -u +'%Y-%m-%d')"
          git push origin "$BRANCH"
          python3 - <<'PY' > pr_body.md
          import json
          v = json.load(open("validation.json"))
          s = json.load(open("verification.json"))
          print("The handicapper researched the slate. This card cleared "
                "every rule in `scripts/lib/card_rules.py`, and every cited "
                "sentence below was found on the page it came from.\n")
          print(f"{v['live']} live picks, {v['units_at_risk']} units at risk, "
                f"{s['sources_verified']} of {s['sources_checked']} sources "
                f"confirmed.\n")
          if s["unverified_on_live_picks"]:
              print("## Read these before merging\n")
              for line in s["unverified_on_live_picks"]:
                  print(f"- {line}\n")
          for w in v.get("warnings", []):
              print(f"Warning: {w}\n")
          print("## What the machine did not check\n")
          print(s["note"] + "\n")
          print("Nothing here is published until this merges.\n")
          PY
          # The branch is pushed and the card is safe on it before this
          # runs, so a refusal here is a missing button rather than lost
          # work. Say which button.
          #
          # 27 August: everything upstream of this passed, the branch went
          # up, and the call was refused because the repository has "Allow
          # GitHub Actions to create and approve pull requests" turned off,
          # which is the default. The step exited 1 with no explanation and
          # a valid card sat on a branch nobody knew about.
          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
          SUMMARY=$(python3 -c "import json; v=json.load(open('validation.json')); print(f\"{v['live']} live picks, {v['units_at_risk']} units at risk.\")")
          if gh pr create --title "Weekly card: $(date -u +'%Y-%m-%d')" \
                          --body-file pr_body.md \
                          --base main --head "$BRANCH" 2> pr_err.txt; then
            echo "Pull request opened. $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Refused. That is a repository setting rather than a broken
          # card, and the card is already committed on the branch, so
          # deliver it the way that does work instead of stranding it.
          # The human gate is unchanged. Nothing publishes until a merge.
          REASON=$(tr -d '\n' < pr_err.txt | head -c 300)
          {
            echo "$SUMMARY"
            echo
            echo "**Open the pull request:** $COMPARE"
            echo
            cat pr_body.md
            echo
            echo "---"
            echo
            echo "GitHub refused to open the pull request itself:"
            echo "\`$REASON\`"
            echo
            echo "To have it opened automatically next time, enable Settings,"
            echo "Actions, General, Workflow permissions, allow GitHub Actions"
            echo "to create and approve pull requests. Until then the card"
            echo "arrives here, which works the same way."
          } > issue_body.md
          if gh issue create --title "Card ready to publish: $(date -u +'%Y-%m-%d')" \
                             --body-file issue_body.md; then
            {
              echo "### Card delivered as an issue"
              echo
              echo "$SUMMARY Open it: $COMPARE"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Pull request refused. Card delivered as an issue. $COMPARE"
            exit 0
          fi
          echo "::error::Card is on $BRANCH but could not be delivered. Open it at $COMPARE"
          cat pr_body.md
          exit 1
